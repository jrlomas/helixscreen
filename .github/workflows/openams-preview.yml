name: OpenAMS Raspberry Pi 64-bit preview

on:
  push:
    branches: [packaging/openams-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openams-preview-${{ github.ref }}
  cancel-in-progress: false

env:
  HELIX_PATCHES_FROM_CLEAN: "1"

jobs:
  build:
    if: github.repository == 'jrlomas/helixscreen'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/init-submodules

      - name: Identify preview
        id: version
        run: |
          version="$(cat VERSION.txt)-openams.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=openams-preview-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Prepare runner for cross-compilation
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 16G /swapfile-helix
          sudo chmod 600 /swapfile-helix
          sudo mkswap /swapfile-helix
          sudo swapon /swapfile-helix
          df -h /
          free -h

      - name: Validate installer and shell behavior
        run: |
          make apply-patches
          sudo npm install -g bats
          bash scripts/bundle-installer.sh -o /tmp/install-regen.sh
          bash scripts/bundle-uninstaller.sh -o /tmp/uninstall-regen.sh
          diff scripts/install.sh /tmp/install-regen.sh
          diff scripts/uninstall.sh /tmp/uninstall-regen.sh
          make test-shell

      - uses: docker/setup-buildx-action@v4
      - uses: actions/cache@v5
        with:
          path: /tmp/.ccache-openams-pi
          key: openams-pi-${{ runner.os }}-${{ github.sha }}
          restore-keys: openams-pi-${{ runner.os }}-

      - name: Configure compiler cache
        run: |
          mkdir -p /tmp/.ccache-openams-pi
          printf 'max_size = 2G\ncompression = true\n' > /tmp/.ccache-openams-pi/ccache.conf

      - name: Build Raspberry Pi toolchain
        run: |
          docker buildx build \
            --cache-from type=gha,scope=openams-toolchain-pi \
            --cache-to type=gha,mode=max,scope=openams-toolchain-pi \
            --load -t helixscreen/toolchain-pi \
            -f docker/Dockerfile.pi docker/

      - name: Build ARM64 DRM and framebuffer binaries
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/src \
            -v /tmp/.ccache-openams-pi:/root/.cache/ccache \
            -e CCACHE_DIR=/root/.cache/ccache \
            -e HELIX_PATCHES_FROM_CLEAN \
            -w /src helixscreen/toolchain-pi \
            make PLATFORM_TARGET=pi-both HELIX_PACKAGING=1 \
              HELIX_VERSION="$PREVIEW_VERSION" SKIP_OPTIONAL_DEPS=1 -j"$(nproc)"
          sudo chown -R "$(id -u):$(id -g)" build/

      - name: Verify binary architecture and OpenAMS backend
        run: |
          for binary in build/pi/bin/helix-screen build/pi-fbdev/bin/helix-screen; do
            test -x "$binary"
            readelf -h "$binary" | grep 'Machine:.*AArch64'
            strings "$binary" | grep 'OpenAMS' > /dev/null
          done
          for features in build/pi/bin/.build-features build/pi-fbdev/bin/.build-features; do
            grep -x 'remote_control=no' "$features"
            grep -x 'diag_uploads=yes' "$features"
          done

      - name: Generate assets and package
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          make venv-setup
          make gen-all-images
          make release-pi VERSION="$PREVIEW_VERSION"
          cp scripts/install.sh releases/install.sh
          printf 'Repository: %s\nCommit: %s\nVersion: %s\nPlatform: Raspberry Pi ARM64\nBuild: %s/%s/actions/runs/%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$PREVIEW_VERSION" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > releases/BUILD_INFO.txt
          cd releases
          tar -tzf "helixscreen-pi-v${PREVIEW_VERSION}.tar.gz" > archive-contents.txt
          grep -x 'helixscreen/bin/helix-screen' archive-contents.txt
          grep -x 'helixscreen/bin/helix-screen-fbdev' archive-contents.txt
          grep -x 'helixscreen/install.sh' archive-contents.txt
          unzip -t helixscreen-pi.zip
          sha256sum "helixscreen-pi-v${PREVIEW_VERSION}.tar.gz" helixscreen-pi.zip install.sh BUILD_INFO.txt > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: openams-pi64-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            releases/helixscreen-pi-*.tar.gz
            releases/helixscreen-pi.zip
            releases/install.sh
            releases/BUILD_INFO.txt
            releases/SHA256SUMS

  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: openams-pi64-preview
          path: release-files
      - name: Publish preview after successful package checks
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ needs.build.outputs.tag }}
          PREVIEW_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd release-files
          sha256sum -c SHA256SUMS
          gh release create "$PREVIEW_TAG" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "OpenAMS preview ${PREVIEW_VERSION} — Raspberry Pi 64-bit" \
            --notes-file ../.github/openams-preview-notes.md \
            --prerelease --draft --latest=false \
            helixscreen-pi-*.tar.gz helixscreen-pi.zip install.sh BUILD_INFO.txt SHA256SUMS
          gh release edit "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
